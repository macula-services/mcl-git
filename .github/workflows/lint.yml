# Structural lint, dialyzer and the unit suite, on the macula CI image
# (OTP 28.4.3, an OpenSSL with ML-DSA, rebar3, Rust, cmake, git).
#
# macula's CBOR, crypto, UCAN, DID and MRI NIFs always build from source, which
# is why Rust is needed here too.

name: lint-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      # ⚠ MUST MATCH THE `Containerfile' beside it: OTP 28.4.3, pinned by digest.
      # mcl_git_service_tests guards both pins.
      image: ghcr.io/macula-io/macula-ci-otp:20260923-1347@sha256:b2260d084a3d3c5e0b74932c4ee052a0cadfddddb6587d5d2214873e6bb06330
    steps:
      - uses: actions/checkout@v4
      - name: Verify the toolchain is the one we think it is
        run: |
          openssl version
          rebar3 version
          git --version
          erl -noshell -eval '
            Otp = string:trim(element(2, file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"])))),
            Mldsa = lists:member(mldsa87, crypto:supports(public_keys)),
            io:format("OTP ~s, mldsa87 ~p~n", [Otp, Mldsa]),
            case {Otp, Mldsa} of
                {<<"28.4.3">>, true} -> halt(0);
                _                    -> halt(1)
            end.'
      - run: rebar3 lint
      - run: rebar3 as test eunit
      - run: rebar3 dialyzer
